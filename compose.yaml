services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: discord_archive
      POSTGRES_USER: discord_archive
      POSTGRES_PASSWORD: discord_archive
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_archive -d discord_archive"]
      interval: 5s
      timeout: 5s
      retries: 10

  discord-archiver:
    build:
      context: .
      dockerfile: apps/archiver/Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      TZ: Asia/Tokyo
      DISCORD_ARCHIVER_SCHEDULE_TIME: "03:00"
      DISCORD_ARCHIVER_RUN_ON_START: "true"
    volumes:
      - ./archive:/data/archive
    command: ["-out-dir", "/data/archive"]

  discord-archive-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://discord_archive:discord_archive@postgres:5432/discord_archive?sslmode=disable
    volumes:
      - ./archive:/data/archive:ro
    command: ["-out-dir", "/data/archive", "-addr", ":8080"]
    depends_on:
      postgres:
        condition: service_healthy

  discord-archive-importer:
    build:
      context: .
      dockerfile: apps/importer/Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_ARCHIVE_WEB_URL: http://discord-archive-web:8080
    volumes:
      - ./archive:/data/archive:ro
    command: ["-archive-dir", "/data/archive", "-interval", "30s"]
    depends_on:
      - discord-archive-web

volumes:
  postgres-data:
