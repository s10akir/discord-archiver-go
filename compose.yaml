services:
  discord-archiver:
    build:
      context: .
      dockerfile: apps/archiver/Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      TZ: Asia/Tokyo
      DISCORD_ARCHIVER_SCHEDULE_TIME: "03:00"
      DISCORD_ARCHIVER_RUN_ON_START: "true"
    volumes:
      - ./archive:/data/archive
    command: ["-out-dir", "/data/archive"]

  discord-archive-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./archive:/data/archive:ro
    command: ["-out-dir", "/data/archive", "-addr", ":8080"]
